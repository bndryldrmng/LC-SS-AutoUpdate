name: Xcode - Build

on: 
  push:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: sidestore-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_sidestore:
    name: Check official SideStore nightly
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      marker: ${{ steps.check.outputs.marker }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - name: Compare with the last published bundle
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const { data: upstream } = await github.rest.repos.getReleaseByTag({
              owner: 'SideStore', repo: 'SideStore', tag: 'nightly'
            });
            const asset = upstream.assets.find(a => a.name === 'SideStore.ipa' && a.state === 'uploaded');
            if (!asset || !Number.isSafeInteger(asset.id)) {
              throw new Error('The official SideStore nightly IPA is unavailable.');
            }
            if (asset.digest && !/^sha256:[a-f0-9]{64}$/.test(asset.digest)) {
              throw new Error('Unexpected SideStore asset digest.');
            }
            const fingerprint = `${asset.id}:${asset.digest || asset.updated_at}:${asset.size}`;
            const marker = `<!-- sidestore-build:${fingerprint}:${context.sha} -->`;
            let previous;
            try {
              ({ data: previous } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: 'nightly'
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const published = previous && !previous.draft &&
              (previous.body || '').includes(marker) &&
              previous.assets.some(a => a.name === 'LiveContainer+SideStore.ipa' && a.state === 'uploaded');
            const shouldBuild = context.eventName !== 'schedule' || !published;
            core.setOutput('build', String(shouldBuild));
            core.setOutput('marker', marker);
            core.setOutput('sha256', asset.digest ? asset.digest.slice(7) : '');
            await core.summary.addHeading('Official SideStore nightly')
              .addRaw(shouldBuild ? 'Building and packaging the current nightly.' : 'The published bundle is already up to date.')
              .addLink('SideStore release', upstream.html_url).write();

  build:
    name: Build using xcodebuild command
    needs: check_sidestore
    if: needs.check_sidestore.outputs.build == 'true'
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Verify the downloaded SideStore and finished IPA
        env:
          SIDESTORE_SHA256: ${{ needs.check_sidestore.outputs.sha256 }}
        run: |
          if [ -n "$SIDESTORE_SHA256" ]; then
            printf '%s  %s\n' "$SIDESTORE_SHA256" tmp/SideStore.ipa | shasum -a 256 --check
          fi
          unzip -tq "$scheme+SideStore.ipa"
          test -f Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore
          test -f Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/LiveWidgetExtension

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'schedule' || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build, check_sidestore]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Install source update dependencies
        run: python -m pip install requests
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the successfully published SideStore build
        uses: actions/github-script@v8
        env:
          SIDESTORE_BUILD_MARKER: ${{ needs.check_sidestore.outputs.marker }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: 'nightly'
            });
            const body = (release.body || '').replace(/\n?<!-- sidestore-build:[^\n]*-->/g, '');
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id,
              body: `${body}\n\nUses the [official SideStore nightly](https://github.com/SideStore/SideStore/releases/tag/nightly).\n${process.env.SIDESTORE_BUILD_MARKER}`
            });
